name: Binance Bot Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile bot.py

      - name: Bot verification
        run: echo "Bot code passed the syntax check!"
