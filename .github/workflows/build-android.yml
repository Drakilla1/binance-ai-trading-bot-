name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android_app/**"
      - "buildozer.spec"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev gettext autopoint

      # Pin the JDK explicitly; GitHub-hosted runners may default JAVA_HOME to Java 11.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Buildozer and Python-for-Android tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/kivy/buildozer
          python -m pip install legacy-cgi setuptools cython==0.29.34

      # Bootstrap downloads the Android command-line tools and SDK.
      - name: Bootstrap Android SDK
        run: |
          yes | buildozer android debug || true

      - name: Accept Android SDK licenses and install required packages
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT"
            find "$HOME/.buildozer" -maxdepth 6 -type f -name sdkmanager || true
            exit 1
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # Ensure Buildozer clones the configured p4a develop branch from scratch.
      # Keep the downloaded Android SDK so this does not repeat the full SDK setup.
      - name: Reset python-for-android checkout and build files
        run: |
          rm -rf .buildozer/android/platform/python-for-android
          rm -rf .buildozer/android/platform/build-arm64-v8a

      - name: Build debug APK
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: binance-ai-trading-bot-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
