name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android_app/**"
      - "buildozer.spec"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-setuptools \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      # First invocation bootstraps the Android command-line tools and SDK.
      # It may stop at the license prompt; the next step accepts licenses explicitly.
      - name: Bootstrap Android SDK
        run: |
          yes | buildozer android debug || true

      - name: Accept Android SDK licenses and install required packages
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT"
            find "$HOME/.buildozer" -maxdepth 6 -type f -name sdkmanager || true
            exit 1
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          mkdir -p "$SDK_ROOT"
          # sdkmanager must be given the SDK root explicitly in CI.
          # The yes process can receive SIGPIPE after sdkmanager accepts all licenses;
          # tolerate that pipeline status, then let package installation report real errors.
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # The SDK bootstrap can leave python-for-android's build venv half-updated.
      # Recreate that venv cleanly before the real APK build.
      - name: Reset python-for-android build environment
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a/build/venv

      - name: Build debug APK
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: binance-ai-trading-bot-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
